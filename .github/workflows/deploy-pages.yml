name: Deploy UNLOCK WITH SEIFY student portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate learner JavaScript
        run: node --check assets/main.js
      - name: Validate essential files
        run: test -s index.html && test -s assets/main.css && test -s assets/main.js
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
